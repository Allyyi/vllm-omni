# Stage config for running MiniCPM-O-4_5 with 3-stage architecture
# Stage 0: Thinker (Qwen3-8B + SigLip2 + Whisper → text + hidden states)
# Stage 1: TTS (LlamaModel AR decoder → audio token IDs)
# Stage 2: Token2Wav (CosyVoice2 flow + HiFi-GAN → 24kHz waveform)

async_chunk: false
stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      process: true
      devices: "0"
    engine_args:
      model_stage: thinker
      model_arch: MiniCPMOForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.6
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      distributed_executor_backend: "mp"
    is_comprehension: true
    final_output: true
    final_output_type: text
    default_sampling_params:
      temperature: 0.7
      top_p: 0.8
      top_k: 100
      max_tokens: 2048
      seed: 42
      detokenize: true

  - stage_id: 1
    stage_type: llm
    runtime:
      process: true
      devices: "0"
    engine_args:
      model_stage: tts
      model_arch: MiniCPMOForConditionalGeneration
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.15
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      async_scheduling: false
      max_num_batched_tokens: 8192
      distributed_executor_backend: "mp"
    engine_input_source: [0]
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.minicpm4_5_o.llm2tts
    final_output: false
    default_sampling_params:
      temperature: 0.1
      top_p: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      detokenize: false

  - stage_id: 2
    stage_type: llm
    runtime:
      process: true
      devices: "0"
    engine_args:
      model_stage: token2wav
      model_arch: MiniCPMOForConditionalGeneration
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.1
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: audio
      enable_prefix_caching: false
      async_scheduling: false
      max_num_batched_tokens: 65536
      distributed_executor_backend: "mp"
    engine_input_source: [1]
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.minicpm4_5_o.tts2token2wav
    final_output: true
    final_output_type: audio
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: false
