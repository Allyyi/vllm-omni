# Stage config for running MiniCPM-O-4_5 in full duplex (async_chunk) mode.
# Stage 0: Thinker (Qwen3-8B + SigLip2 + Whisper → text + hidden states, streamed per step)
# Stage 1: TTS (LlamaModel AR decoder → audio token IDs, chunked generation)
# Stage 2: Token2Wav (CosyVoice2 flow + HiFi-GAN → 24kHz waveform, streaming)

async_chunk: true
stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      process: true   
      devices: "0"
    engine_args:
      model_stage: thinker
      model_arch: MiniCPMOForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.6
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      distributed_executor_backend: "mp"
      # Per-step async chunk processor: streams hidden states to TTS stage
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.minicpm4_5_o.llm2tts_async_chunk
    is_comprehension: true
    final_output: true
    final_output_type: text
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.7
      top_p: 0.8
      top_k: 100
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.05

  - stage_id: 1
    stage_type: llm
    runtime:
      process: true
      devices: "0"
    engine_args:
      model_stage: tts
      model_arch: MiniCPMOForConditionalGeneration
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.15
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      async_scheduling: false
      max_num_batched_tokens: 8192
      distributed_executor_backend: "mp"
    engine_input_source: [0]
    input_connectors:
      from_stage_0: connector_of_shared_memory
    final_output: false
    default_sampling_params:
      temperature: 0.1
      top_p: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      detokenize: false

  - stage_id: 2
    stage_type: llm
    runtime:
      process: true   
      devices: "0"
    engine_args:
      model_stage: token2wav
      model_arch: MiniCPMOForConditionalGeneration
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.1
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: audio
      enable_prefix_caching: false
      async_scheduling: false
      max_num_batched_tokens: 65536
      distributed_executor_backend: "mp"
    engine_input_source: [1]
    # Batch-mode processor: generation workers don't support per-step async emission,
    # so TTS→Token2Wav uses the standard batch pipeline (one call per TTS chunk).
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.minicpm4_5_o.tts2token2wav
    final_output: true
    final_output_type: audio
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: false

runtime:
  connectors:
    connector_of_shared_memory:
      name: SharedMemoryConnector
      extra:
        # Token2wav streaming chunk config (25 tokens ≈ 1 sec audio at 24kHz)
        codec_chunk_frames: 25
        codec_left_context_frames: 25
